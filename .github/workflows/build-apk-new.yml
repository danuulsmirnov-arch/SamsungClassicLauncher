name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unpack project
        run: unzip -q SamsungClassicLauncher.zip

      - name: Align Kotlin JVM target with Java
        working-directory: SamsungClassicLauncher
        run: |
          find . -type f \( -name '*.gradle' -o -name '*.gradle.kts' \) -print0 | xargs -0 -r sed -i -e 's/VERSION_1_8/VERSION_17/g' -e 's/jvmTarget = "1.8"/jvmTarget = "17"/g'

      - name: Build debug APK
        working-directory: SamsungClassicLauncher
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SamsungClassicLauncher-debug
          path: SamsungClassicLauncher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
