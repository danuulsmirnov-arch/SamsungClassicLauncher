name: Build Samsung Launcher APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project ZIP
        uses: actions/checkout@v4
        with:
          sparse-checkout: /SamsungClassicLauncher.zip
          sparse-checkout-cone-mode: false

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: unzip -q SamsungClassicLauncher.zip

      - name: Set Kotlin target to Java 8
        working-directory: SamsungClassicLauncher
        run: |
          cat > /tmp/kotlin-fix.init.gradle <<'EOF'
          allprojects {
              afterEvaluate {
                  tasks.configureEach { task ->
                      if (task.name.toLowerCase().contains("kotlin") && task.hasProperty("kotlinOptions")) {
                          task.kotlinOptions.jvmTarget = "1.8"
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        working-directory: SamsungClassicLauncher
        run: gradle --no-daemon --init-script /tmp/kotlin-fix.init.gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: SamsungClassicLauncher-APK
          path: SamsungClassicLauncher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
