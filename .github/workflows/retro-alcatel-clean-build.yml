name: Retro Alcatel Clean Build

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Install Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'
  - name: Download project ZIP only
    run: |
      curl -L --fail -o RetroAlcatel-project.zip https://raw.githubusercontent.com/danuulsmirnov-arch/SamsungClassicLauncher/main/RetroAlcatel-project.zip
  - name: Install Android SDK
    uses: android-actions/setup-android@v3
  - name: Install SDK components
    run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
  - name: Install Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.7'
  - name: Extract project
    run: unzip -o RetroAlcatel-project.zip
  - name: Build APK
    working-directory: RetroAlcatel
    run: gradle --no-daemon assembleDebug
  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: RetroAlcatel-APK
      path: RetroAlcatel/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
