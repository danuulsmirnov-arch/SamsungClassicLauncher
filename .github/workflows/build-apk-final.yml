name: Build Samsung Launcher APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: unzip -q SamsungClassicLauncher.zip

      - name: Build APK
        working-directory: SamsungClassicLauncher
        run: gradle --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: SamsungClassicLauncher-APK
          path: SamsungClassicLauncher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
